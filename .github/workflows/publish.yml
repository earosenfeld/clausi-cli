name: Publish to PyPI

# Publishes clausi to PyPI when a version tag is pushed (e.g. v1.0.2, v1.1.0).
# Uses PyPI Trusted Publishing — no API tokens needed; auth is via GitHub OIDC.
#
# Setup (one-time, on PyPI):
#   1. https://pypi.org/manage/project/clausi/settings/publishing/
#   2. "Add a new publisher" → GitHub
#   3. Fill in:
#        Owner:              earosenfeld
#        Repository name:    clausi-cli
#        Workflow filename:  publish.yml
#        Environment name:   pypi    (matches `environment:` below)
#   4. Save. From then on, pushing a v* tag publishes automatically.
#
# Cutting a release:
#   git tag v1.0.2 && git push origin v1.0.2

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clausi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
